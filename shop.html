<section class="container">

      </video>
    </div>
    <div class="tile reveal from-right"><img src="assets/gallery/gallery-5.jpg" alt=""/></div>
    <div class="tile reveal from-left"><img src="assets/gallery/gallery-6.jpg" alt=""/></div>
    <div class="tile reveal from-bottom"><img src="assets/gallery/gallery-7.jpg" alt=""/></div>
